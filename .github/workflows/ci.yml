name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifications:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatage
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Tests et couverture (100 % sur le domaine)
        run: pnpm test:coverage

  application:
    name: Application de bureau (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Construction et parcours utilisateur (Playwright + Electron)
        run: xvfb-run -a pnpm test:e2e
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-playwright
          path: apps/desktop/playwright-report/
          if-no-files-found: ignore

  mutation:
    name: Mutation (domaine ≥ 80 %)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mutation
      - name: Rapport de mutation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-mutation
          path: packages/*/reports/mutation/
          if-no-files-found: ignore
